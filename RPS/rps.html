<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="'stylesheet" href="rps.css">
</head>
<body>
    <button onclick="player('Rock')">Rock</button>
    <button onclick="player('Paper')">Paper</button>
    <button onclick="player('Scissor')">Scissor</button>
    <button onclick="
    score.wins=0;
    score.loses=0;
    score.ties=0;
    localStorage.removeItem('score');
    scorecard();
    ">Reset Score</button>
    <p class="choice"></p>
    <p class="game"></p>
    <p class="scorep"></p>

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins:0,
            loses:0,
            ties:0,
        }      
        scorecard();
        function pickcomputermove(){
            const randomnumber = Math.random();

            let computermove = '';

            if(randomnumber>=0 && randomnumber<1/3){
                computermove ='Rock';
            }
            else if(randomnumber>=1/3 && randomnumber<2/3){
                computermove ='Paper';
            }
            else if(randomnumber>=2/3 && randomnumber<1){
                computermove ='Scissor';
            }
            return computermove;
        }
        function player(playermove){
            let computermove = pickcomputermove();

            let result = '';

            if(playermove === 'Rock'){
                if(computermove === "Rock"){
                    result="Tie";
                }
                else if(computermove === "Paper"){
                    result="You lose";
                }
                else if(computermove === "Scissor"){
                    result="You win!";
                }
            }
            else if(playermove === 'Paper'){
                if(computermove === "Rock"){
                    result="You win!";
                }
                else if(computermove === "Paper"){
                    result="Tie";
                }
                else if(computermove === "Scissor"){
                    result="You lose";
                }
            }
            else if(playermove === 'Scissor'){
                if(computermove === "Rock"){
                    result="You lose";
                }
                else if(computermove === "Paper"){
                    result="You win!";
                }
                else if(computermove === "Scissor"){
                    result="Tie";
                }
            }
            if(result === "You win!"){
                score.wins += 1;
            }
            else if(result === "You lose"){
                score.loses += 1;
            }
            else if(result === "Tie"){
                score.ties +=1;
            }
            localStorage.setItem('score',JSON.stringify(score)); 
            document.querySelector('.choice')
                .innerHTML=`Player's choice : ${playermove}, Computer's choice: ${computermove}`;
            document.querySelector('.game')
                .innerHTML=`Player ${result}`;
            scorecard();
        }
        function scorecard(){
            document.querySelector('.scorep')
                .innerHTML =` Wins :${score.wins} Loses : ${score.loses} Ties : ${score.ties}`;
        }
    </script>

</body>
</html>
