<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
    <header>
        <div class="header">
            <div class="logo"></div>
            <a>Today</a>
            <a>iCloud</a>
            <a>Store</a>
            <a>News</a>
            <a>Privacy</a>
        </div>
    </header>
    <div class="box">
    <main>
        <div class="img"><img src= "apple.svg"></div>
        <form class="forms" action="https://www.google.com/search">
            <input class="search" type="text" name="q" placeholder="Apple Search">
            <input class="submit" type="submit" value="Search">
        </form>
    </main>
    <div class="safe"><button class="safesearch" onclick="thinking()">Deep Think</button></div>
    </div>
    <footer>
        <div>India</div>
        <div> &copy;Apple Inc.</div>
        <div>Business</div>
        <div>Advertising</div>
        <div>Terms and Conditions</div>
        <div>Settings</div>
    </footer>
    <script>
        function thinking(){
        var1=document.querySelector('.safesearch');
            if(var1.innerHTML = "Deep Think"){
                var1.innerHTML ="Thinking Deep...";
            }
            else if(var1.innerHTML="Thinking Deep..."){
                var1.innerHTML="Deep Think";
                
            }
        }
    </script>

</body>
</html>
